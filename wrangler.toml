name = "claude-bridge"
main = "src/worker/index.ts"
compatibility_date = "2024-09-02"

[vars]
OAUTH_REDIRECT_URI = "https://claude-bridge.woodywang2013.workers.dev/auth/callback"
ADMIN_ORIGIN = "https://claude-bridge.woodywang2013.workers.dev"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "BridgeRoom" }
]

[[kv_namespaces]]
binding = "SESSIONS"
id = "ff7dd365b2974c28b7ad416563e4503f"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BridgeRoom"]

# Secrets (set via wrangler secret put):
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
